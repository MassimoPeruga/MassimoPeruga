name: Update profile statistics and Tetris

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/profile-assets.yml

concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run generate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save updated profile assets
        run: |
          git add assets/generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile statistics and Tetris'
          git push origin HEAD:main
